[project]
name = "my-private-space"
version = "0.1.0"
description = "Local-first browser-based encrypted file vault"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1.0",
  "uvicorn[standard]>=0.30,<1.0",
  "cryptography>=43,<47",
  "python-multipart>=0.0.9,<1.0",
  "jinja2>=3.1,<4.0",
  "Pillow>=10,<13",
  "pillow-heif>=0.18,<2",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
